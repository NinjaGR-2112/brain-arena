<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Brain Arena</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container" style="max-width: 400px; padding-top: 4rem;">
    <h1>Register</h1>

    <div class="card">
        <input type="text" id="username" placeholder="Username"><br><br>
        <input type="email" id="email" placeholder="Email"><br><br>
        <input type="password" id="password" placeholder="Password (min 8 characters)"><br><br>
        <button id="register-btn">Register</button>
        <p id="error-msg" style="color: var(--danger); display: none;"></p>
    </div>

    <p>Already have an account? <a href="/login">Login</a></p>
</div>

    <script>
        document.getElementById("register-btn").addEventListener("click", async () => {
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email, password }),
            });

            if (response.ok) {
                const loginResponse = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });
                if (loginResponse.ok) {
                    window.location.href = "/dashboard";
                }
            } else {
                const errorMsg = document.getElementById("error-msg");
                const data = await response.json();
                errorMsg.textContent = data.detail || "Registration failed";
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
