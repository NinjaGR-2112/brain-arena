<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Memory - Brain Arena</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
    <h1>Memory</h1>

    {% if duel %}{% include "duel_banner.html" %}{% endif %}

    <div class="card">
        <div id="sequence-display" style="font-size: 2.5em; text-align: center; letter-spacing: 0.2em;">
            {% for digit in sequence %}{{ digit }}{% endfor %}
        </div>

        <div id="answer-area" style="display: none;">
            <p>Enter the sequence you saw:</p>
            <input type="text" id="answer-input" inputmode="numeric" autofocus>
            <button id="submit-btn">Submit</button>
        </div>

        <div id="result-area" style="display: none;"></div>
    </div>

    <p><a href="/dashboard">Back to dashboard</a></p>
</div>

    <script>
        setTimeout(() => {
            document.getElementById("sequence-display").style.display = "none";
            document.getElementById("answer-area").style.display = "block";
            document.getElementById("answer-input").focus();
        }, 3000);

        // Sortie d'un gestionnaire anonyme : la meme fonction sert au clic et
        // a la touche Entree, comme dans calculation.html. Sans cela, il
        // fallait cliquer au bouton alors que le focus est deja dans le champ.
        async function submitAnswer() {
            const answer = document.getElementById("answer-input").value;

            const response = await fetch("/games/memory/submit?answer=" + encodeURIComponent(answer) + duelQuery(), {
                method: "POST"
            });
            const data = await response.json();

            document.getElementById("answer-area").style.display = "none";
            const resultArea = document.getElementById("result-area");
            resultArea.style.display = "block";

            if (data.correct) {
                resultArea.innerHTML = `Correct! Score: ${data.score}, XP earned: ${data.xp_earned}`;
            } else {
                resultArea.innerHTML = `Wrong sequence. Score: ${data.score}, XP earned: ${data.xp_earned}`;
            }
            resultArea.innerHTML += duelResult(data);
        }

        document.getElementById("submit-btn").addEventListener("click", submitAnswer);
        document.getElementById("answer-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitAnswer();
        });
    </script>
    {% if duel %}{% include "duel_script.html" %}{% endif %}
</body>
</html>
